<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Calculadora</title>
</head>

<body>
    <div class="conteiner-principal">
        <div class="card-calculadora">
            <div class="tela">
                <span id="resp"></span>
            </div>
            <div class="num btn" onclick="capturarNum(this)">7</div>
            <div class="num btn" onclick="capturarNum(this)">8</div>
            <div class="num btn" onclick="capturarNum(this)">9</div>
            <div class="operador btn" onclick="capturarNum(this)">x</div>
            <div class="num btn" onclick="capturarNum(this)">4</div>
            <div class="num btn" onclick="capturarNum(this)">5</div>
            <div class="num btn" onclick="capturarNum(this)">6</div>
            <div class="operador btn" onclick="capturarNum(this)">+</div>
            <div class="num btn" onclick="capturarNum(this)">1</div>
            <div class="num btn" onclick="capturarNum(this)">2</div>
            <div class="num btn" onclick="capturarNum(this)">3</div>
            <div class="operador btn" onclick="capturarNum(this)">-</div>
            <div class="num btn" onclick="capturarNum(this)">.</div>
            <div id="zero" class="num btn" onclick="capturarNum(this)">0</div>
            <div id="btn-igual" class="btn" onclick="formatarExpressao()">=</div>
            <div class="operador btn" onclick="capturarNum(this)">/</div>
            <div id="allClear" class="btn" onclick="reseta()"><span>AC</span></div>
            <div id="clear"  class="btn" onclick="apagarCaractere()">C</div>
        </div>
    </div>


    <script src="js/main.js"></script>
</body>

</html>
